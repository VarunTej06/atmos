services:
  weather-service:
    build: ./services/weather-service
    environment:
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_WEATHER_API_URL: http://localhost:8001
    ports:
      - "5173:5173"
    depends_on:
      - weather-service
