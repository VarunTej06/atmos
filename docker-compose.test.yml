# Docker Compose override for running unit, integration, and E2E tests in containers
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up --abort-on-container-exit

services:
  weather-service:
    command: >
      sh -c "pip install --no-cache-dir pytest pytest-cov pytest-asyncio && pytest --cov=app --cov-report=term-missing tests"
    environment:
      - CORS_ORIGINS=*

  frontend:
    command: >
      sh -c "npm run test:coverage"
    environment:
      - CI=true

  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - CI=true
      - BASE_URL=http://frontend:5173
    command: >
      sh -c "npm ci && npx playwright test"
    depends_on:
      - frontend
      - weather-service

